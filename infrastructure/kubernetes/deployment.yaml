apiVersion: apps/v1
kind: Deployment
metadata:
  name: karena-backend
  labels:
    app: karena-ai
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: karena-ai
      component: backend
  template:
    metadata:
      labels:
        app: karena-ai
        component: backend
    spec:
      containers:
        - name: backend
          image: karena-ai/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: karena-secrets
            - configMapRef:
                name: karena-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: karena-backend
spec:
  selector:
    app: karena-ai
    component: backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
