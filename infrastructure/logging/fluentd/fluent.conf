[global]
  log_level = info

[input]
  [input.tail]
    path = "/var/log/karena/*.log"
    read_from_tail = true
    tag = "karena.*"

[filter]
  [filter.parser]
    match_regexp = ^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?P<level>\w+) (?P<message>.*)$
    parser = regexp
    key_name = message

  [filter.kubernetes]
    match = "karena.**"
    kube_url = "https://kubernetes.default.svc:443"
    merge_log = true
    keep_log = false

[output]
  [output.loki]
    match = "*"
    host = "loki"
    port = 3100
    labels = {job="karena-ai"}

  [output.elasticsearch]
    match = "karena.audit.**"
    host = "elasticsearch"
    port = 9200
    index = "karena-audit-logs"
    type = "_doc"

[service]
  flush_interval = 5s
  http_server = true
  http_port = 2020
